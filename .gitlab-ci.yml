# runs all tests and generates a coverage report
tests-full-cov:
  stage: test
  cache: # reuse venv in subsequent jobs
    key: $CI_JOB_NAME
    paths:
      - .cache/pip
      - env/
  image: python:3.10
  before_script:
    - python -m venv env
    - source env/bin/activate
    - pip install pytest
    - pip install pytest-cov
  script:
    - pip install .[test]

    # COVERAGE BADGE
    - python -m pytest --doctest-modules --cov --cov-config=pyproject.toml --cov-branch --cov-report term --cov-report html:build/coverage --junitxml=report.xml
    - coverage report
    - coverage xml
    - pip install anybadge==1.9.0
    - mkdir -p build/badges

    # MAINTAINABILITY BADGE
    - pip install radon==5.1.0
    - python -m radon cc --total-average -nB -s hypertiling
    
    # generate a badge for the maintainability index with the total average of cyclomatic complexity as value
    - python -m anybadge --label=Maintainability --value="$(python -m radon cc --total-average -nc hypertiling | tail -n 1 | cut -d' ' -f 3) ($(python -m radon cc --total-average -nc hypertiling | tail -n 1 | cut -d' ' -f 4 | cut -c 2-4))" -f build/badges/maintainability -o
    
    # DOCUMENTATION BADGE
    # generate a badge for the documentation with the current version as label
    # - color: #1082C2 corresponds to the default "informational" color set by https://shields.io
    # this is some magic to retrieve the package version:
    # - python -m anybadge --label=Documentation --value="v$(python -m hypertiling --version)" --color "#1082C2" -f build/badges/documentation -o
    # here it is set manually:
    # - python -m anybadge --label=Documentation --value="v1.3" --color "#1082C2" -f build/badges/documentation -o
  
  coverage: '/TOTAL.*\s+(\d+\%)/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

    paths:
      - build/coverage
      - build/badges
      #- env/   # too large ...



# runs all jupyter notebooks in the examples folder to ensure they are functional
test-examples:
  image: python:3.10
  stage: test
  when: manual
  variables:
    # Optional: Cache the hatch envs to speed up subsequent manual runs
    HATCH_ENV_TYPE_VIRTUAL_PATH: .venv
  script:
    - pip install hatch
    # This single command handles env creation, dependencies, and the nbmake execution
    - hatch run test:nb
  only:
    - dev
    - master


#### ----------- DOCS ------------ ####

sphinx-doc: # old, remove me
  image: python:3.10
  stage: docs
  when: manual
  artifacts:
    paths:
      - doc/*
  script:
    - pip install .
    - apt-get update
    - apt-get install -y python3-numpy python3-colorama python3-h5py doxygen python3-breathe git python3-sphinx-rtd-theme pandoc python3-networkx
    - pip install --upgrade pip
    - pip install pypandoc sphinx-mdinclude
    - pip install sphinx --upgrade
    - pip3 install --upgrade ipython
    - pip install sphinx-rtd-theme --upgrade
    - pip install nbsphinx --upgrade
    - cd doc
    - mkdir examples
    - cd examples
    - cp ../../examples/*.ipynb .
    - cd ..
    - ls
    - sphinx-build . html

sphinx-doc-new: # replaces sphinx-doc
  image: python:3.10
  stage: docs
  variables:
    # Ensure hatch creates the env inside the project dir for caching if needed
    HATCH_ENV_TYPE_VIRTUAL_PATH: .venv 
  script:
    - apt-get update && apt-get install -y pandoc
    - pip install hatch
    # This single command installs everything in [doc] and runs sphinx-build
    - hatch run doc:build
  artifacts:
    paths:
      - doc/_build/html


#### ----------- PUBLISH & ARCHIVAL ------------ ####

# Job: send-snapshot
# Purpose: Creates a permanent, citable record of the source code on Zenodo.
# This ensures scientific reproducibility by providing a DOI for each version.
send-snapshot:
  # Uses a specialized image 
  image: git.physik.uni-wuerzburg.de:25812/z03/pdi/debian:bullseye-gfortran-blas-lapack-fftw-hdf5-scipy3
  stage: release
  # Execution Rule: Only runs when a version tag (e.g., v1.0.2) is pushed to the repository.
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+/
  script:
    - apt-get update && apt-get install -y git
    # Optional setup script for Zenodo metadata/token handling
    - ./assets/zenodo.sh
    # Creates a clean source distribution (zip) excluding git metadata, named after the tag
    - git archive --format zip --output ${CI_COMMIT_TAG#v}.zip ${CI_COMMIT_TAG}
    # Pushes the zip and metadata (.zenodo.json) to the Zenodo API
    - g2z-send -p -m .zenodo.json ${CI_COMMIT_TAG#v}.zip

# Job: report-and-badges
# Purpose: Aggregates visual reports (Coverage, Linter badges) for the GitLab UI.
report-and-badges:
  stage: publish
  image: python:latest
  # Only runs if the full test suite passes to ensure metrics are accurate
  needs:
    - tests-full-cov
  before_script:
    - '' # Overrides any global before_scripts to keep the environment lean
  script:
    # 'public' is the standard folder GitLab Pages/UI expects for static reports
    - mkdir -p public
    # Debug: verify that the 'build' folder (generated in previous 'tests' stage) exists
    - ls build
    - ls build/badges
    - ls build/coverage
    # Move test artifacts into the public folder for GitLab to serve
    - mv build/badges public/.
    - mv build/coverage public/.
  artifacts:
    paths:
      - public # Files in this path are kept as downloadable/viewable assets

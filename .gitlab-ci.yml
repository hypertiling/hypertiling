unit-test_plain:
    stage: test
    image: git.physik.uni-wuerzburg.de:25812/z03/pdi/debian:bullseye-gfortran-blas-lapack-fftw-hdf5-scipy3
    script:
        - pip3 install .
        - echo "Testing without fancy packages..."
        - python3 -m tests.test_core 

unit-test_fancy:
    stage: test
    image: git.physik.uni-wuerzburg.de:25812/z03/pdi/debian:bullseye-gfortran-blas-lapack-fftw-hdf5-scipy3
    script:
        - apt-get install -y python3-sortedcontainers python3-numba
        - pip3 install .
        - echo "Testing with numba and sortedcontainers..."
        - python3 -m tests.test_core 

Sphinx_doc:
  image: git.physik.uni-wuerzburg.de:25812/z03/pdi/debian:bullseye-gfortran-blas-lapack-fftw-hdf5-scipy3
  stage: docs
  artifacts:
    paths:
      - doc/*
  script:
    - apt-get install -y python3-numpy python3-colorama python3-h5py doxygen python3-breathe git python3-sphinx-rtd-theme
    - cd doc
    - sphinx-build . html


# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

stages:
  - install
  - test
  - docs

# Pip's cache doesn't store the python packages
# https://pip.pypa.io/en/stable/reference/pip_install/#caching
#
# If you want to also cache the installed packages, you have to install
# them in a virtualenv and cache it as well.
cache:
  paths:
    - .cache/pip
    - hypervenv/

before_script:
  - apt-get update && apt-get install --assume-yes python3 python3-pip python3-venv python3-matplotlib
  - python3 --version
  - python3 -m venv hypervenv --without-pip --system-site-packages
  - source hypervenv/bin/activate

install-latest:
  stage: build
  image: python:latest
  stage: install
  script:
    - python setup.py check
    - pip install .
#    - pip install tox flake8 
#    - tox -e py36,flake8


install-slim:
  stage: build
  image: python:slim
  stage: install
  script:
    - python setup.py check
    - pip install .

install-bullseye:
  image: git.physik.uni-wuerzburg.de:25812/z03/pdi/debian:bullseye-gfortran-blas-lapack-fftw-hdf5-scipy3
  stage: install
  script:
    - pip3 install .

install-bookworm:
  image: git.physik.uni-wuerzburg.de:25812/z03/pdi/debian:bookworm-gfortran-blas-lapack-fftw-hdf5-scipy3
  stage: install
  script:
    - python3 -m venv hypervenv --without-pip --system-site-packages
    - source hypervenv/bin/activate
    - python3 -m pip install .

test-pip:
  image: git.physik.uni-wuerzburg.de:25812/z03/pdi/debian:bullseye-gfortran-blas-lapack-fftw-hdf5-scipy3
  stage: test
  script:
    - pip3 install hypertiling

unit-test-plain:
    image: git.physik.uni-wuerzburg.de:25812/z03/pdi/debian:bullseye-gfortran-blas-lapack-fftw-hdf5-scipy3
    stage: test
    script:
        - apt-get install -y python3-networkx
        - pip3 install .
        - echo "Testing without fancy packages..."
        - python3 -m tests.test_core
        - python3 -m tests.test_dynamic
        - python3 -m tests.test_neighbours
        - python3 -m tests.test_compare_neighbours

unit-test-reflection-plain:
    image: git.physik.uni-wuerzburg.de:25812/z03/pdi/debian:bullseye-gfortran-blas-lapack-fftw-hdf5-scipy3
    stage: test
    script:
        - apt-get install -y python3-networkx
        - pip3 install .
        - echo "Testing reflection kernel without numba"
        - python3 -m tests.test_reflectionkernel
        - python3 -m tests.test_grg
        - python3 -m tests.test_grgs

unit-test-fancy:
    image: git.physik.uni-wuerzburg.de:25812/z03/pdi/debian:bullseye-gfortran-blas-lapack-fftw-hdf5-scipy3
    stage: test
    script:
        - apt-get install -y python3-sortedcontainers python3-numba python3-networkx
        - pip3 install .
        - echo "Testing with numba and sortedcontainers..."
        - python3 -m tests.test_core
        - python3 -m tests.test_dynamic
        - python3 -m tests.test_neighbours
        - python3 -m tests.test_compare_neighbours

unit-test-reflection-fancy:
    image: git.physik.uni-wuerzburg.de:25812/z03/pdi/debian:bullseye-gfortran-blas-lapack-fftw-hdf5-scipy3
    stage: test
    script:
        - apt-get install -y python3-numba python3-networkx
        - pip3 install .
        - echo "Testing reflection kernel with numba"
        - python3 -m tests.test_reflectionkernel
        - python3 -m tests.test_grg
        - python3 -m tests.test_grgs

sphinx-doc:
  image: git.physik.uni-wuerzburg.de:25812/z03/pdi/debian:bullseye-gfortran-blas-lapack-fftw-hdf5-scipy3
  stage: docs
  artifacts:
    paths:
      - doc/*
  script:
    - apt-get update
    - apt-get install -y python3-numpy python3-colorama python3-h5py doxygen python3-breathe git python3-sphinx-rtd-theme pandoc python3-networkx
    - pip install --upgrade pip
    - pip install pypandoc sphinx-mdinclude
    - pip install sphinx --upgrade
    - pip install sphinx-rtd-theme --upgrade
    - pip install nbsphinx --upgrade
    - cd doc
    - mkdir examples
    - cd examples
    - cp ../../examples/*.ipynb .
    - cd ..
    - ls
    - sphinx-build . html

send-snapshot:
  image: git.physik.uni-wuerzburg.de:25812/z03/pdi/debian:bullseye-gfortran-blas-lapack-fftw-hdf5-scipy3
  stage: install
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+/
  script:
    - apt-get install -y git
    - ./assets/zenodo.sh
    - git archive --format zip --output ${CI_COMMIT_TAG#v}.zip ${CI_COMMIT_TAG}
    - g2z-send -p -m .zenodo.json ${CI_COMMIT_TAG#v}.zip





coverage:
  stage: test
  script:
    - pip install .[test]
    - pytest --doctest-modules --cov --cov-config=pyproject.toml --cov-branch --cov-report term --cov-report html:build/coverage --junitxml=report.xml
    - coverage report
    - coverage xml
    - pip install anybadge==1.9.0
    - mkdir -p build/badges



pages:
  stage: publish
  needs:
    - test
  #only:
  #  - main
  #  - staging
  script:
    - mkdir -p public
    - source env/bin/activate
    - pip install .[doc]
    #- DOCS_TARGET=public make docs
    - mv build/badges public/.
    - mv build/coverage public/.
  artifacts:
    paths:
      - public

# runs tests without numba and sortedcontainers
unit-test-plain:
    image: python:latest
    stage: test
    before_script:
      - python -m venv env
      - source env/bin/activate
      - pip install pytest
    script:
        - pip install .
        
        - echo "Testing without fancy packages, such as numba..."
        - python3 -m tests.test_core

[project]

name = "hypertiling"
version = "1.5.1"


description = "hypertiling is a high-performance Python library for the generation and visualization of regular hyperbolic lattices"
readme = "README.md" # Optional
requires-python = ">=3.5"

authors = [
  { name = "Manuel Schrauth"}, 
  { name = "Yanick Thurn"},
  { name = "Florian Goth"},
  { name = "Jefferson S. E. Portela"},
  { name = "Dietmar Herdt"},
  { name = "Felix Dusel"},
]

maintainers = [
  { name = "Manuel Schrauth"}, 
  { name = "Yanick Thurn"},
  { name = "Florian Goth"},
  { name = "Jefferson S. E. Portela"},
  { name = "Dietmar Herdt"},
  { name = "Felix Dusel"},]

dependencies = ["numpy", "matplotlib", "networkx", "setuptools", "sortedcontainers", "scipy", "ipython"]


[project.optional-dependencies] # Optional
numba = ["numba"]
dev = [
    "black", 
    "radon", 
    "pytest", 
    "pytest-cov", 
    "coverage[toml]", 
    "nbmake",
    "pre-commit",
    "nbstripout"
]
doc = [
    "sphinx",
    "sphinx-rtd-theme",
    "nbsphinx",
    "sphinx-mdinclude",
    "pypandoc",
    "ipykernel",
    "ipython"
]
nbbuild = [
    "nbconvert",
    "jupyter",
    "ipykernel"
]


[build-system]
requires = ["setuptools>=43.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
command_line = "-m pytest --cov --cov-config=pyproject.toml --cov-branch --cov-report term-missing --cov-report html:build/coverage"
source = ["hypertiling"] 

[tool.coverage.report]
omit = ["**/__init__.py", "**/__main__.py"]

exclude_lines = [
  "pragma: no cover",
  "# nocov",
  "if __name__ == .__main__.",
]

[tool.coverage.html]
directory = "build/coverage"


[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["src", "tests"]
norecursedirs = [
    "hypervenv",
    "src/hypertiling/experimental",
    ".venv",
    "venv",
    "build",
    "dist"
]


[tool.hatch.envs.default]
features = ["nbbuild", "dev"]

# This ensures the git hooks are installed the moment a user runs a hatch command
post-install-commands = [
  "pre-commit install"
]

[tool.hatch.envs.default.scripts]
examples = "jupyter nbconvert --to notebook --execute --inplace examples/*.ipynb"


[tool.hatch.envs.doc]
features = ["doc"]
# Ensures the kernel is named 'python3' so nbsphinx can find it in the CI
post-install-commands = [
  "python -m ipykernel install --user --name python3"
]

[tool.hatch.envs.doc.scripts]
# Builds the docs into the standard Sphinx location
build = "sphinx-build -b html doc/ doc/_build/html"

name: CI/CD Pipeline

on:
  push:
    # Removing the specific list allows all branches to trigger a run
    branches: ["**"] 
    tags: ['v*']
  pull_request:
    # This triggers when a PR is opened against any branch
    branches: ["**"]
  workflow_dispatch: # Allows manual triggers like GitLab's "when: manual"

jobs:
  # --- INSTALL & MATRIX TEST ---
  install-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.5", "3.7", "3.10"]
        image-type: [standard, slim]
        exclude:
          - python-version: "3.5"
            image-type: slim
          - python-version: "3.7"
            image-type: slim
    
    container: 
      image: ${{ matrix.image-type == 'slim' && format('python:{0}-slim', matrix.python-version) || format('python:{0}', matrix.python-version) }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Install System Dependencies
        run: |
          apt-get update && apt-get install --assume-yes python3 python3-pip python3-venv python3-matplotlib
          
      - name: Setup Virtualenv and Install
        run: |
          python3 -m venv hypervenv --without-pip --system-site-packages
          source hypervenv/bin/activate
          pip install .

  # --- COVERAGE & BADGES ---
  tests-full-cov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Run Coverage and Generate Badges
        run: |
          pip install pytest pytest-cov anybadge==1.9.0 radon==5.1.0 .[test]
          python -m pytest --doctest-modules --cov --cov-config=pyproject.toml --cov-branch --cov-report term --cov-report xml:coverage.xml --junitxml=report.xml
          mkdir -p build/badges
          # Maintainability Badge logic
          VALUE=$(python -m radon cc --total-average -nc hypertiling | tail -n 1 | cut -d' ' -f 3)
          GRADE=$(python -m radon cc --total-average -nc hypertiling | tail -n 1 | cut -d' ' -f 4 | cut -c 2-4)
          python -m anybadge --label=Maintainability --value="$VALUE ($GRADE)" -f build/badges/maintainability -o

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/badges
            coverage.xml
            report.xml

  # --- JUPYTER NOTEBOOK TESTS (Hatch) ---
  test-examples:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Hatch Notebook Tests
        run: |
          pip install hatch
          hatch run test:nb

  # --- DOCUMENTATION (Hatch) ---
  sphinx-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build Docs
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          pip install hatch
          hatch run doc:build
      - name: Upload HTML Docs
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: doc/_build/html

  # --- RELEASE & ZENODO ---
  release-snapshot:
    needs: [tests-full-cov]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Using your specific physics department image
    container:
      image: git.physik.uni-wuerzburg.de:25812/z03/pdi/debian:bullseye-gfortran-blas-lapack-fftw-hdf5-scipy3
    steps:
      - uses: actions/checkout@v4
      - name: Zenodo Upload
        run: |
          apt-get update && apt-get install -y git
          ./assets/zenodo.sh
          TAG_NAME=${GITHUB_REF#refs/tags/}
          FILENAME=${TAG_NAME#v}.zip
          git archive --format zip --output $FILENAME $TAG_NAME
          g2z-send -p -m .zenodo.json $FILENAME
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
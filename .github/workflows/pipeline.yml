name: CI/CD Pipeline

on:
  push:
    # Removing the specific list allows all branches to trigger a run
    branches: ["**"] 
    tags: ['v*']
  pull_request:
    # This triggers when a PR is opened against any branch
    branches: ["**"]
  workflow_dispatch: # Allows manual triggers like GitLab's "when: manual"

jobs:
  install-local:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Don't cancel other versions if one fails
      matrix:
        # Testing across all currently non-EOL versions
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # Automated caching of your dependencies

      - name: Install System Dependencies
        # Only install what setup-python doesn't provide
        run: |
          sudo apt-get update
          sudo apt-get install -y libgfortran5 libblas-dev liblapack-dev # for your physics deps

      - name: Install Project
        run: |
          python -m pip install --upgrade pip
          pip install .


  install-local-numba:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Testing across all currently non-EOL versions
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # Automated caching

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgfortran5 libblas-dev liblapack-dev

      - name: Install Project with Numba
        run: |
          python -m pip install --upgrade pip
          # Installs the core package plus the numba optional dependency
          pip install ".[numba]"

      - name: Verify Numba Acceleration
        run: |
          # Confirms that the compiler is actually available and functional
          python -c "import numba; print(f'Numba {numba.__version__} verified on Python ${{ matrix.python-version }}')"


  install-from-pypi:
      needs: [install-local]
      runs-on: ubuntu-latest
      steps:
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            # This automatically fetches the latest stable version 
            # available on the runner, so it never needs manual updating.
            python-version: '3.x' 
        
        - name: Install and Verify
          run: |
            pip install --no-cache-dir hypertiling
            python -c "import hypertiling; print(f'Verified {hypertiling.__version__}')"


  install-from-pypi-with-numba:
    needs: [install-local-numba]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' # Tracks latest stable
      
      - name: Install and Verify Numba
        run: |
          # Verifies the [numba] extra is correctly published to PyPI
          pip install --no-cache-dir "hypertiling[numba]"
          python -c "import hypertiling; import numba; print(f'Verified {hypertiling.__version__} with Numba {numba.__version__}')"



  # --- COVERAGE & BADGES ---
  tests-full-cov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Run Coverage and Generate Badges
        run: |
          pip install pytest pytest-cov anybadge==1.9.0 radon==5.1.0 ".[test,numba]"
          python -m pytest --doctest-modules --cov --cov-config=pyproject.toml --cov-branch --cov-report term --cov-report xml:coverage.xml --junitxml=report.xml
          mkdir -p build/badges
          # Maintainability Badge logic
          VALUE=$(python -m radon cc --total-average -nc hypertiling | tail -n 1 | cut -d' ' -f 3)
          GRADE=$(python -m radon cc --total-average -nc hypertiling | tail -n 1 | cut -d' ' -f 4 | cut -c 2-4)
          python -m anybadge --label=Maintainability --value="$VALUE ($GRADE)" -f build/badges/maintainability -o

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/badges
            coverage.xml
            report.xml

  # --- JUPYTER NOTEBOOK TESTS (Hatch) ---
  test-examples:
    # if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Hatch Notebook Tests
        env:
          # This prevents Hatch from trying to run 'pre-commit install'
          HATCH_ENV_NO_FREEZE: "true"
          HATCH_SKIP_SCRIPTS: "true"        
        run: |
          pip install hatch pre-commit
          hatch run test:nb

  unit-test-plain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' # Use latest stable
          cache: 'pip'

      - name: Install (Plain)
        run: |
          python -m pip install --upgrade pip
          pip install pytest .

      - name: Run Core Tests (No Numba)
        run: |
          echo "Testing without fancy packages, such as numba..."
          python3 -m tests.test_core
          python3 -m tests.test_dynamic
          python3 -m tests.test_neighbours
          python3 -m tests.test_compare_neighbours

  unit-test-fancy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # High-performance baseline
          cache: 'pip'

      - name: Install (Fancy)
        run: |
          python -m pip install --upgrade pip
          # Explicitly installing the extras you identified as 'fancy'
          pip install numba sortedcontainers .[test]

      - name: Run Core Tests (With Numba)
        run: |
          echo "Testing with numba and sortedcontainers..."
          python3 -m tests.test_core
          python3 -m tests.test_dynamic
          python3 -m tests.test_neighbours
          python3 -m tests.test_compare_neighbours



  # --- DOCUMENTATION (Hatch) ---
  sphinx-doc:
    runs-on: ubuntu-latest
    needs: [test-examples,unit-test-plain,unit-test-fancy]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build Docs
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          pip install hatch
          hatch run doc:build
      - name: Upload HTML Docs
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: doc/_build/html

  # --- RELEASE & ZENODO ---
  release-snapshot:
    needs: [tests-full-cov]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Using your specific physics department image
    container:
      image: git.physik.uni-wuerzburg.de:25812/z03/pdi/debian:bullseye-gfortran-blas-lapack-fftw-hdf5-scipy3
    steps:
      - uses: actions/checkout@v4
      - name: Zenodo Upload
        run: |
          apt-get update && apt-get install -y git
          ./assets/zenodo.sh
          TAG_NAME=${GITHUB_REF#refs/tags/}
          FILENAME=${TAG_NAME#v}.zip
          git archive --format zip --output $FILENAME $TAG_NAME
          g2z-send -p -m .zenodo.json $FILENAME
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}